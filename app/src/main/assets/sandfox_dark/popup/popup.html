<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sandfox Dark</title><link rel="stylesheet" href="popup.css"></head><body><main><header><div class="mark">S</div><div><strong>SANDFOX DARK</strong><span id="site">Current site</span></div></header><section class="hero"><label class="switch"><input id="enabled" type="checkbox"><span></span></label><div><b>Dark pages</b><small id="status">Loading…</small></div></section><div class="presets"><button data-preset="balanced">Balanced</button><button data-preset="deep">Deep</button><button data-preset="oled">OLED</button></div><section class="card"><h2>Rendering</h2><label>Darkness threshold <output id="thresholdOut"></output><input id="threshold" type="range" min=".05" max=".45" step=".01"></label><label>Background floor <output id="floorOut"></output><input id="floor" type="range" min=".02" max=".30" step=".01"></label><label>Background peak <output id="peakOut"></output><input id="peak" type="range" min=".15" max=".65" step=".01"></label><label>Text minimum <output id="fgFloorOut"></output><input id="fgFloor" type="range" min=".55" max=".95" step=".01"></label></section><section class="card toggles"><h2>Compatibility</h2><label><span>Image-aware processing</span><input id="images" type="checkbox"></label><label><span>Brighter borders</span><input id="borders" type="checkbox"></label><label><span>Darken embedded frames with parent</span><input id="embeds" type="checkbox"></label><label><span>OLED black floor</span><input id="oled" type="checkbox"></label></section><button id="exclude" class="primary">Exclude this site</button><button id="reset" class="secondary">Reset site</button><footer>Sandfox Dark Engine 2.0 · local settings · no telemetry</footer></main><script src="popup.js"></script></body></html>
