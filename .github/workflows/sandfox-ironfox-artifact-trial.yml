name: Sandfox IronFox Artifact Trial

on:
  push:
    branches:
      - sandfox/ironfox-artifact-trial
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandfox-ironfox-artifact-trial
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Host resource snapshot and cleanup
        shell: bash
        run: |
          set -euo pipefail
          echo "=== BEFORE CLEANUP ==="
          free -h
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android-sdk
          sudo rm -rf "$RUNNER_TOOL_CACHE" || true
          docker system prune -af || true
          echo "=== AFTER CLEANUP ==="
          free -h
          df -h /

      - name: Checkout Sandfox artifact trial metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/workflows/sandfox-ironfox-artifact-trial.yml
          sparse-checkout-cone-mode: false

      - name: Clone exact IronFox checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ironfox-oss/IronFox.git ironfox
          cd ironfox
          git fetch --depth 1 origin ca0c9673b328fd2b23e80293326a22610239eb47
          git checkout --detach ca0c9673b328fd2b23e80293326a22610239eb47
          test "$(git rev-parse HEAD)" = "ca0c9673b328fd2b23e80293326a22610239eb47"
          echo "IronFox checkpoint verified."
          grep -E '^readonly IRONFOX_GECKO_(COMMIT|VERSION)=' scripts/versions.sh

      - name: Build exact IronFox container
        shell: bash
        working-directory: ironfox
        run: |
          set -euo pipefail
          docker build --pull -t ironfox-artifact-trial:ca0c9673 .
          docker image inspect ironfox-artifact-trial:ca0c9673 --format 'IronFox image={{.Id}} size={{.Size}} bytes'
          df -h /

      - name: Get sources and enable artifact Gecko for this trial
        shell: bash
        working-directory: ironfox
        run: |
          set -euo pipefail
          CI_PIPELINE_CREATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          cat > "$RUNNER_TEMP/ironfox-artifact-trial.sh" <<'CONTAINER_SCRIPT'
          set -euo pipefail
          chmod +x scripts/*.sh

          # GitHub codeload returned HTTP 502 and then HTTP 429 for the pinned Gecko
          # archive. Acquire the exact same Gecko commit through Git instead, then make
          # IronFox skip only its redundant codeload download.
          test ! -e external/gecko
          mkdir -p external/gecko
          git init external/gecko
          git -C external/gecko remote add origin https://github.com/mozilla-firefox/firefox.git
          git -C external/gecko fetch --depth 1 origin fdd757a2e09c9471cddf383e64e631e4ce178499
          git -C external/gecko checkout --detach FETCH_HEAD
          test "$(git -C external/gecko rev-parse HEAD)" = "fdd757a2e09c9471cddf383e64e631e4ce178499"
          test -f external/gecko/mach

          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/get_sources-if.sh")
          s = p.read_text()
          old = '  download_and_extract "https://github.com/mozilla-firefox/firefox/archive/__COMMIT__.tar.gz" "__GECKO__" "__SHA__"'
          new = '''  if [[ -f "__GECKO__/mach" ]] && [[ "$(git -C "__GECKO__" rev-parse HEAD 2>/dev/null)" == "__COMMIT__" ]]; then
            echo_green_text "SUCCESS: Using pre-populated Firefox source at path: '__GECKO__'!"
            return 0
          fi
          download_and_extract "https://github.com/mozilla-firefox/firefox/archive/__COMMIT__.tar.gz" "__GECKO__" "__SHA__"'''
          old = old.replace("__COMMIT__", "$"+"{IRONFOX_GECKO_COMMIT}").replace("__GECKO__", "$"+"{IRONFOX_GECKO}").replace("__SHA__", "$"+"{IRONFOX_GECKO_SHA512SUM}")
          new = new.replace("__COMMIT__", "$"+"{IRONFOX_GECKO_COMMIT}").replace("__GECKO__", "$"+"{IRONFOX_GECKO}").replace("__SHA__", "$"+"{IRONFOX_GECKO_SHA512SUM}")
          assert s.count(old) == 1, f"expected one Gecko archive call, found {s.count(old)}"
          p.write_text(s.replace(old, new, 1))
          PY

          ./scripts/get_sources.sh
          git config --global --add safe.directory /app/ironfox
          ./scripts/prebuild.sh all
          CONTAINER_SCRIPT
          docker run --rm -i             --user root             -v "$GITHUB_WORKSPACE/ironfox:/app/ironfox"             -w /app/ironfox             -e HOME=/root             -e IRONFOX_CI=1             -e IRONFOX_DEV_BRANCH=dev             -e IRONFOX_PROD_BRANCH=main             -e CI_COMMIT_REF_NAME="$GITHUB_REF_NAME"             -e CI_PIPELINE_CREATED_AT="$CI_PIPELINE_CREATED_AT"             -e IRONFOX_SIGN_SKIP_ADB=1             -e IRONFOX_SIGN=0             -v "$RUNNER_TEMP/ironfox-artifact-trial.sh:/tmp/ironfox-artifact-trial.sh:ro"             ironfox-artifact-trial:ca0c9673             /bin/bash /tmp/ironfox-artifact-trial.sh
          echo "=== DISK AFTER SOURCES/PREBUILD ==="
          df -h /
          du -sh ironfox 2>/dev/null || true
          du -sh ironfox/external 2>/dev/null || true

      - name: Build ARM64 APK with Gecko artifacts
        shell: bash
        working-directory: ironfox
        run: |
          set -euo pipefail
          CI_PIPELINE_CREATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          docker run --rm             --user root             -v "$GITHUB_WORKSPACE/ironfox:/app/ironfox"             -w /app/ironfox             -e HOME=/root             -e IRONFOX_CI=1             -e IRONFOX_DEV_BRANCH=dev             -e IRONFOX_PROD_BRANCH=main             -e CI_COMMIT_REF_NAME="$GITHUB_REF_NAME"             -e CI_PIPELINE_CREATED_AT="$CI_PIPELINE_CREATED_AT"             -e IRONFOX_SIGN_SKIP_ADB=1             -e IRONFOX_SIGN=0             -e IRONFOX_SB_GAPI_KEY_FILE=/tmp/ironfox-sb-gapi-key.txt             -e GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m"             ironfox-artifact-trial:ca0c9673             /bin/bash -lc '
              set -euo pipefail
              mkdir -p /opt/IronFox
              printf "%s\n" "sandfox-artifact-trial-placeholder" > /opt/IronFox/ironfox-sb-gapi-key.txt
              git config --global --add safe.directory /app/ironfox
              test "$(git -C external/gecko rev-parse HEAD)" = "fdd757a2e09c9471cddf383e64e631e4ce178499"
              test -f external/gecko/mach

              # This trial proves the base ARM64 browser build and artifact export.
              # Run #15 already proved APK creation. Disable IronFox CI signing in the
              # workspace copy of env_ci.sh so build.sh does not require the private
              # production keystore.
              sed -i "s|^export IRONFOX_ANDROID_KEYSTORE=.*$|export IRONFOX_ANDROID_KEYSTORE='null'|" scripts/env_ci.sh
              sed -i "s|^export IRONFOX_ANDROID_KEYSTORE_KEY_ALIAS=.*$|export IRONFOX_ANDROID_KEYSTORE_KEY_ALIAS='null'|" scripts/env_ci.sh
              sed -i "s|^export IRONFOX_ANDROID_KEYSTORE_KEY_PASS_FILE=.*$|export IRONFOX_ANDROID_KEYSTORE_KEY_PASS_FILE='null'|" scripts/env_ci.sh
              sed -i "s|^export IRONFOX_ANDROID_KEYSTORE_PASS_FILE=.*$|export IRONFOX_ANDROID_KEYSTORE_PASS_FILE='null'|" scripts/env_ci.sh
              grep -F "export IRONFOX_ANDROID_KEYSTORE='null'" scripts/env_ci.sh
              grep -F "export IRONFOX_ANDROID_KEYSTORE_KEY_ALIAS='null'" scripts/env_ci.sh
              grep -F "export IRONFOX_ANDROID_KEYSTORE_KEY_PASS_FILE='null'" scripts/env_ci.sh
              grep -F "export IRONFOX_ANDROID_KEYSTORE_PASS_FILE='null'" scripts/env_ci.sh

              if ! bash -x ./scripts/build.sh arm64; then
                echo "=== BUILD FAILURE LOG ==="
                if [ -f artifacts/logs/build-arm64.log ]; then
                  tail -n 400 artifacts/logs/build-arm64.log
                else
                  echo "build-arm64.log was not created"
                fi
                exit 1
              fi
            '
          echo "=== DISK AFTER BUILD ==="
          df -h /

      - name: Upload ARM64 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sandfox-ironfox-artifact-trial-arm64
          path: |
            ironfox/outputs/**/*.apk
            ironfox/artifacts/**/*.apk
          if-no-files-found: error

      - name: Final resource snapshot
        if: always()
        shell: bash
        run: |
          echo "=== FINAL RESOURCE SNAPSHOT ==="
          free -h || true
          df -h / || true
