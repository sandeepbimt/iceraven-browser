name: Sandfox IronFox Artifact Trial

on:
  push:
    branches:
      - sandfox/ironfox-artifact-trial
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandfox-ironfox-artifact-trial
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Host resource snapshot and cleanup
        shell: bash
        run: |
          set -euo pipefail
          echo "=== BEFORE CLEANUP ==="
          free -h
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android-sdk
          sudo rm -rf "$RUNNER_TOOL_CACHE" || true
          docker system prune -af || true
          echo "=== AFTER CLEANUP ==="
          free -h
          df -h /

      - name: Checkout Sandfox artifact trial metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/workflows/sandfox-ironfox-artifact-trial.yml
          sparse-checkout-cone-mode: false

      - name: Clone exact IronFox checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ironfox-oss/IronFox.git ironfox
          cd ironfox
          git fetch --depth 1 origin ca0c9673b328fd2b23e80293326a22610239eb47
          git checkout --detach ca0c9673b328fd2b23e80293326a22610239eb47
          test "$(git rev-parse HEAD)" = "ca0c9673b328fd2b23e80293326a22610239eb47"
          echo "IronFox checkpoint verified."
          grep -E '^readonly IRONFOX_GECKO_(COMMIT|VERSION)=' scripts/versions.sh

      - name: Build exact IronFox container
        shell: bash
        working-directory: ironfox
        run: |
          set -euo pipefail
          docker build --pull -t ironfox-artifact-trial:ca0c9673 .
          docker image inspect ironfox-artifact-trial:ca0c9673 --format 'IronFox image={{.Id}} size={{.Size}} bytes'
          df -h /

      - name: Get sources and enable artifact Gecko for this trial
        shell: bash
        working-directory: ironfox
        run: |
          set -euo pipefail
          CI_PIPELINE_CREATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          cat > "$RUNNER_TEMP/ironfox-artifact-trial.sh" <<'CONTAINER_SCRIPT'
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/get_sources.sh

          # Diagnostic-only change: enable Gecko artifact builds at this checkpoint.
          test "$(grep -Fc "ac_add_options --disable-artifact-builds" configs/mozconfigs/core.mozconfig)" = "1"
          test "$(grep -Fc "export MOZ_ARTIFACT_BUILDS=" configs/mozconfigs/core.mozconfig)" = "1"
          sed -i "/ac_add_options --disable-artifact-builds/d" configs/mozconfigs/core.mozconfig
          sed -i "/export MOZ_ARTIFACT_BUILDS=/d" configs/mozconfigs/core.mozconfig
          printf '%s\n' 'ac_add_options --enable-artifact-builds' >> configs/mozconfigs/core.mozconfig
          printf '%s\n' 'export MOZ_ARTIFACT_BUILDS=1' >> configs/mozconfigs/core.mozconfig
          test "$(grep -Fc "ac_add_options --enable-artifact-builds" configs/mozconfigs/core.mozconfig)" = "1"
          test "$(grep -Fc 'imply_option("--enable-artifact-builds", False)' patches/gecko-overlay/ironfox/ironfox.configure)" = "1"
          sed -i 's/imply_option("--enable-artifact-builds", False)/imply_option("--enable-artifact-builds", True)/' patches/gecko-overlay/ironfox/ironfox.configure
          grep -F 'imply_option("--enable-artifact-builds", True)' patches/gecko-overlay/ironfox/ironfox.configure
          test "$(grep -Fc "ac_add_options --disable-artifact-builds" configs/mozconfigs/core.mozconfig)" = "0"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("configs/mozconfigs/ironfox.mozconfig")
          s = p.read_text()
          old = 'if [[ "${IRONFOX_MACH_BUILD}" == 1 ]]; then'
          new = 'if [[ "${IRONFOX_MACH_BUILD}" == 1 ]] && [[ "${MOZ_ARTIFACT_BUILDS:-}" != 1 ]]; then'
          assert s.count(old) == 1, f"expected exactly one build-mozconfig selector, found {s.count(old)}"
          p.write_text(s.replace(old, new, 1))
          s = p.read_text()
          assert s.count(new) == 1, "artifact selector replacement was not applied exactly once"
          print("SUCCESS: artifact mode selects no-build.mozconfig")
          PY

          # Artifact mode requires live Mozilla Taskcluster. IronFox normally points
          # Taskcluster at noop.invalid to prevent Mozilla artifact/prebuild downloads.
          # This trial explicitly opts into Mozilla Gecko artifact retrieval.
          test "$(grep -Fc "readonly TASKCLUSTER_PROXY_URL='https://noop.invalid'" scripts/env_external.sh)" = "1"
          test "$(grep -Fc "readonly TASKCLUSTER_ROOT_URL='https://noop.invalid'" scripts/env_external.sh)" = "1"
          sed -i "s|readonly TASKCLUSTER_PROXY_URL='https://noop.invalid'|readonly TASKCLUSTER_PROXY_URL='https://firefox-ci-tc.services.mozilla.com'|" scripts/env_external.sh
          sed -i "s|readonly TASKCLUSTER_ROOT_URL='https://noop.invalid'|readonly TASKCLUSTER_ROOT_URL='https://firefox-ci-tc.services.mozilla.com'|" scripts/env_external.sh
          test "$(grep -Fc "readonly TASKCLUSTER_PROXY_URL='https://firefox-ci-tc.services.mozilla.com'" scripts/env_external.sh)" = "1"
          test "$(grep -Fc "readonly TASKCLUSTER_ROOT_URL='https://firefox-ci-tc.services.mozilla.com'" scripts/env_external.sh)" = "1"

          # Artifact mode has no compile environment. The normal IronFox Gecko path
          # selects build.mozconfig, whose compiler/toolchain options are unavailable.
          # Select no-build.mozconfig for this artifact-only trial instead.

          git config --global --add safe.directory /app/ironfox
          ./scripts/prebuild.sh all
          CONTAINER_SCRIPT
          docker run --rm -i             --user root             -v "$GITHUB_WORKSPACE/ironfox:/app/ironfox"             -w /app/ironfox             -e HOME=/root             -e IRONFOX_CI=1             -e IRONFOX_DEV_BRANCH=dev             -e IRONFOX_PROD_BRANCH=main             -e CI_COMMIT_REF_NAME="$GITHUB_REF_NAME"             -e CI_PIPELINE_CREATED_AT="$CI_PIPELINE_CREATED_AT"             -e IRONFOX_SIGN_SKIP_ADB=1             -e IRONFOX_SIGN=0             -v "$RUNNER_TEMP/ironfox-artifact-trial.sh:/tmp/ironfox-artifact-trial.sh:ro"             ironfox-artifact-trial:ca0c9673             /bin/bash /tmp/ironfox-artifact-trial.sh
          echo "=== DISK AFTER SOURCES/PREBUILD ==="
          df -h /
          du -sh ironfox 2>/dev/null || true
          du -sh ironfox/external 2>/dev/null || true

      - name: Build ARM64 APK with Gecko artifacts
        shell: bash
        working-directory: ironfox
        run: |
          set -euo pipefail
          CI_PIPELINE_CREATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          docker run --rm             --user root             -v "$GITHUB_WORKSPACE/ironfox:/app/ironfox"             -w /app/ironfox             -e HOME=/root             -e IRONFOX_CI=1             -e IRONFOX_DEV_BRANCH=dev             -e IRONFOX_PROD_BRANCH=main             -e CI_COMMIT_REF_NAME="$GITHUB_REF_NAME"             -e CI_PIPELINE_CREATED_AT="$CI_PIPELINE_CREATED_AT"             -e IRONFOX_SIGN_SKIP_ADB=1             -e IRONFOX_SIGN=0             -e IRONFOX_SB_GAPI_KEY_FILE=/tmp/ironfox-sb-gapi-key.txt             -e GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m"             ironfox-artifact-trial:ca0c9673             /bin/bash -lc '
              set -euo pipefail
              mkdir -p /opt/IronFox
              printf "%s\n" "sandfox-artifact-trial-placeholder" > /opt/IronFox/ironfox-sb-gapi-key.txt
              git config --global --add safe.directory /app/ironfox
              git -C external/gecko init
              git -C external/gecko remote add origin https://github.com/mozilla-firefox/firefox.git
              git -C external/gecko fetch --depth 1 origin fdd757a2e09c9471cddf383e64e631e4ce178499
              git -C external/gecko reset --mixed fdd757a2e09c9471cddf383e64e631e4ce178499
              test "$(git -C external/gecko rev-parse HEAD)" = "fdd757a2e09c9471cddf383e64e631e4ce178499"
              test -n "$(git -C external/gecko status --short)"
              ./scripts/build.sh arm64
            '
          echo "=== DISK AFTER BUILD ==="
          df -h /

      - name: Upload ARM64 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sandfox-ironfox-artifact-trial-arm64
          path: |
            ironfox/outputs/**/*.apk
            ironfox/artifacts/**/*.apk
          if-no-files-found: error

      - name: Final resource snapshot
        if: always()
        shell: bash
        run: |
          echo "=== FINAL RESOURCE SNAPSHOT ==="
          free -h || true
          df -h / || true
