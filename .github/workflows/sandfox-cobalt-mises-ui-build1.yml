name: Sandfox Cobalt Mises UI Build 1

on:
  push:
    branches:
      - sandfox/cobalt-mises-ui-build1
  pull_request:
    branches:
      - iceraven
  workflow_dispatch:

concurrency:
  group: sandfox-cobalt-mises-ui-build1
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Sandfox trial
        uses: actions/checkout@v4

      - name: Checkout Cobalt nightly
        uses: actions/checkout@v4
        with:
          repository: AurielSolaris/Cobalt
          ref: nightly
          path: cobalt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply Mises-style UI skin
        run: bash tools/sandfox_mises_ui_build1.sh

      - name: Build Cobalt Android shell
        working-directory: cobalt
        run: ./gradlew :modules:app:assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        working-directory: cobalt
        run: find modules/app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sandfox-cobalt-mises-ui-build1
          path: cobalt/modules/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
