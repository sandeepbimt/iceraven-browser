name: CI

on:
  push:
    branches:
      - iceraven
      - standalone-webapps-2.49.0
      - sandfox/pwa-launch-performance
      - sandfox/pwa-prewarm
      - sandfox/reader-typography-v1
      - sandfox/adblock-ublock-assist-v1
      - sandfox/page-transition-v1

jobs:
  release-automation:
    name: Build App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Install Rust for Sandfox adblock WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build Sandfox Brave adblock WASM
        run: |
          rm -rf app/src/main/assets/extensions/sandfox_adblock/wasm
          wasm-pack build tools/sandfox-adblock-wasm             --target web             --release             --out-dir ../../app/src/main/assets/extensions/sandfox_adblock/wasm

      - name: Build pinned uBlock Origin content engine
        run: bash tools/sandfox-ublock/build.sh

      - name: Install Android SDK with pieces Gradle skips
        run: ./automation/iceraven/install-sdk.sh

      - name: Inspect memory
        run: free -h

      - name: Create version name
        run: echo "VERSION_NAME=$(git describe --tags HEAD)" >> $GITHUB_ENV

      - name: Patch on the fly
        run: |
          ./automation/iceraven/patch_android_components.sh
          ./automation/iceraven/setup_venv.sh

      - name: Relpace strings
        run: |
          sed -i 's/Firefox/Iceraven/g' app/src/*/res/values*/*strings.xml
          sed -i '/about_content/s/Mozilla/@forkmaintainers/' app/src/*/res/values*/*strings.xml
          sed -i '/<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%s/%1$s/g; /<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%d/%2$d/g' app/src/*/res/values*/*strings.xml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build forkRelease variant of app
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx7g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dev/stderr"
        run: |
          /usr/bin/time -v ./gradlew app:assembleForkRelease -PversionName=\${{ env.VERSION_NAME }} --stacktrace --no-daemon

      - name: Debug
        run: |
          /usr/bin/ls -alh gradle/build/app/outputs/apk/forkRelease/

      - name: Sign APKs with temporary test key
        env:
          KEYSTORE_PASSWORD: iceraven-test
          KEY_PASSWORD: iceraven-test
        run: |
          set -e
          keytool -genkeypair \
            -keystore /tmp/iceraven-test.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias iceraven-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Iceraven Test"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          echo "Using $APKSIGNER"
          for apk in gradle/build/app/outputs/apk/forkRelease/*-unsigned.apk; do
            signed="${apk%-unsigned.apk}.apk"
            "$APKSIGNER" sign \
              --ks /tmp/iceraven-test.jks \
              --ks-key-alias iceraven-test \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --key-pass pass:"$KEY_PASSWORD" \
              --out "$signed" \
              "$apk"
          done
          "$APKSIGNER" verify --verbose gradle/build/app/outputs/apk/forkRelease/app-arm64-v8a-forkRelease.apk

      - name: Debug
        run: |
          /usr/bin/ls -alh gradle/build/app/outputs/apk/forkRelease/

      - name: Upload arm64 apk
        uses: actions/upload-artifact@v7
        with:
          path: gradle/build/app/outputs/apk/forkRelease/app-arm64-v8a-forkRelease.apk
          name: iceraven-standalone-arm64-v8a

