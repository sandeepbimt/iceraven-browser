name: CI

on:
  push:
    branches:
      - iceraven
      - standalone-webapps-2.49.0
      - sandfox/pwa-launch-performance
      - sandfox/pwa-prewarm
      - sandfox/dark-engine-v1
      - sandfox/dark-engine-v2

jobs:
  release-automation:
    name: Build App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Install Android SDK with pieces Gradle skips
        run: ./automation/iceraven/install-sdk.sh

      - name: Inspect memory
        run: free -h

      - name: Create version name
        run: echo "VERSION_NAME=$(git describe --tags HEAD)" >> $GITHUB_ENV

      - name: Patch on the fly
        run: |
          ./automation/iceraven/patch_android_components.sh
          ./automation/iceraven/setup_venv.sh

      - name: Apply frozen SANDFOX branding
        run: |
          # Branding-only layer. Package IDs, Gecko, PWA, dark-engine and extension logic stay unchanged.
          sed -i 's/Firefox/SANDFOX/g; s/Iceraven/SANDFOX/g' app/src/*/res/values*/*strings.xml
          sed -i '/about_content/s/Mozilla/SANDFOX/' app/src/*/res/values*/*strings.xml
          sed -i '/<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%s/%1$s/g; /<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%d/%2$d/g' app/src/*/res/values*/*strings.xml
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/sandfox_icon.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
<path android:fillColor="#12161C" android:pathData="M0,0h108v108h-108z"/>
