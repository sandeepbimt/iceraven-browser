name: CI

on:
  push:
    branches:
      - iceraven
      - standalone-webapps-2.49.0
      - sandfox/pwa-launch-performance
      - sandfox/pwa-prewarm
      - sandfox/reader-typography-v1
      - sandfox/native-protection-v1-clean
      - sandfox/native-protection-v2-annoyances-picker
      - sandfox/adblock-brave-ublock-v1
      - sandfox/m1-native-engine-integration

jobs:
  release-automation:
    name: Build App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Install Android SDK with pieces Gradle skips
        run: ./automation/iceraven/install-sdk.sh

      - name: Inspect memory
        run: free -h

      - name: Checkout pinned Sandfox Gecko
        run: |
          set -e
          git clone --depth 1 --no-tags --branch sandfox/m1-native-engine-cache https://github.com/sandeepbimt/sandfox-gecko.git sandfox-gecko
          test "$(git -C sandfox-gecko rev-parse HEAD)" = "f242c984e5a4dce93ac9beb802d3a65149cfdf77"

      - name: Configure and build Sandfox GeckoView
        working-directory: sandfox-gecko
        env:
          MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE: none
        run: |
          set -e
          ./mach python -m pip install --disable-pip-version-check --require-hashes -r build/zstandard_requirements.txt
          ./mach --no-interactive bootstrap --application-choice="GeckoView/Firefox for Android"
          cat > .mozconfig <<'EOF'
          ac_add_options --enable-project=mobile/android
          ac_add_options --target=aarch64
          ac_add_options --enable-optimize
          ac_add_options --disable-debug
          ac_add_options --disable-tests
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-aarch64-unknown-linux-android
          EOF
          ./mach build

      - name: Configure local GeckoView substitution
        run: |
          printf '\ndependencySubstitutions.geckoviewTopsrcdir=%s\ndependencySubstitutions.geckoviewTopobjdir=%s\n' \
            "$GITHUB_WORKSPACE/sandfox-gecko" \
            "$GITHUB_WORKSPACE/sandfox-gecko/obj-aarch64-unknown-linux-android" >> local.properties

      - name: Create version name
        run: echo "VERSION_NAME=$(git describe --tags HEAD)" >> $GITHUB_ENV

      - name: Patch on the fly
        run: |
          ./automation/iceraven/patch_android_components.sh
          ./automation/iceraven/setup_venv.sh

      - name: Relpace strings
        run: |
          sed -i 's/Firefox/Iceraven/g' app/src/*/res/values*/*strings.xml
          sed -i '/about_content/s/Mozilla/@forkmaintainers/' app/src/*/res/values*/*strings.xml
          sed -i '/<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%s/%1$s/g; /<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%d/%2$d/g' app/src/*/res/values*/*strings.xml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build forkRelease variant of app
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx7g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dev/stderr"
        run: |
          /usr/bin/time -v ./gradlew app:assembleForkRelease -PversionName=\${{ env.VERSION_NAME }} --stacktrace --no-daemon

      - name: Debug
        run: |
          /usr/bin/ls -alh gradle/build/app/outputs/apk/forkRelease/

      - name: Sign APKs with temporary test key
        env:
          KEYSTORE_PASSWORD: iceraven-test
          KEY_PASSWORD: iceraven-test
        run: |
          set -e
          keytool -genkeypair \
            -keystore /tmp/iceraven-test.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias iceraven-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Iceraven Test"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          echo "Using $APKSIGNER"
          for apk in gradle/build/app/outputs/apk/forkRelease/*-unsigned.apk; do
            signed="${apk%-unsigned.apk}.apk"
            "$APKSIGNER" sign \
              --ks /tmp/iceraven-test.jks \
              --ks-key-alias iceraven-test \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --key-pass pass:"$KEY_PASSWORD" \
              --out "$signed" \
              "$apk"
          done
          "$APKSIGNER" verify --verbose gradle/build/app/outputs/apk/forkRelease/app-arm64-v8a-forkRelease.apk

      - name: Debug
        run: |
          /usr/bin/ls -alh gradle/build/app/outputs/apk/forkRelease/

      - name: Upload arm64 apk
        uses: actions/upload-artifact@v7
        with:
          path: gradle/build/app/outputs/apk/forkRelease/app-arm64-v8a-forkRelease.apk
          name: iceraven-standalone-arm64-v8a

