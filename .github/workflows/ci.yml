name: CI

on:
  push:
    branches:
      - iceraven
      - standalone-webapps-2.49.0
      - sandfox/pwa-launch-performance
      - sandfox/pwa-prewarm
      - sandfox/reader-typography-v1
      - sandfox/adblock-ublock-assist-v1
      - sandfox/dark-pages-v4-final
      - sandfox/dark-pages-v4-build2

jobs:
  release-automation:
    name: Build App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Install Rust for Sandfox adblock WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

