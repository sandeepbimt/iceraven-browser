name: Sandfox launch crash diagnostic

on:
  push:
    branches:
      - sandfox/diagnose-launch-crash

jobs:
  launch-test:
    name: Install and launch Sandfox APK
    runs-on: ubuntu-24.04
    steps:
      - name: Download known-good Sandfox APK artifact
        uses: actions/download-artifact@v5
        with:
          name: sandfox-x86_64
          path: apk
          github-token: ${{ github.token }}
          repository: sandeepbimt/iceraven-browser
          run-id: 37034943982

      - name: Run Sandfox on Android emulator
        id: emulator
        uses: SweetRainGarden/SrgGactionEmulatorenvsetupAndroid@main
        with:
          apk-path: ${{ github.workspace }}/apk/app-x86_64-forkRelease.apk
          run-script-path: .github/scripts/sandfox-launch-test.sh
          api-level: '35'
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none -camera-front none

      - name: Upload launch log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sandfox-launch-log
          path: launch-log.txt
          if-no-files-found: ignore
