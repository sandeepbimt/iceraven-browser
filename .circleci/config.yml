version: 2.1

jobs:
  c2-chromium-dependencies:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - run:
          name: Measure build VM
          command: |
            set -eux
            echo "=== BEFORE CHECKOUT: DISK ==="
            df -hT
            echo "=== BEFORE CHECKOUT: RAM ==="
            free -h
      - run:
          name: Install depot_tools
          command: |
            set -eux
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
            echo 'export PATH="$HOME/depot_tools:$PATH"' >> "$BASH_ENV"
      - run:
          name: Checkout pinned Chromium source
          command: |
            set -eux
            export PATH="$HOME/depot_tools:$PATH"

            CHROMIUM_TAG="151.0.7922.38"
            CHROMIUM_URL="https://chromium.googlesource.com/chromium/src.git"
            WORKDIR="$HOME/afterbird-chromium"
            SRC_DIR="$WORKDIR/src"

            mkdir -p "$SRC_DIR"
            git -C "$SRC_DIR" init
            git -C "$SRC_DIR" remote add origin "$CHROMIUM_URL"

            git -C "$SRC_DIR" \
              -c protocol.version=2 \
              -c http.lowSpeedLimit=0 \
              -c http.lowSpeedTime=300 \
              fetch --no-tags --depth=1 origin \
              "+refs/tags/$CHROMIUM_TAG:refs/tags/$CHROMIUM_TAG"

            git -C "$SRC_DIR" checkout --force --detach "$CHROMIUM_TAG"
            git -C "$SRC_DIR" describe --tags --exact-match
      - run:
          name: Prepare Chromium dependency sync
          command: |
            set -eux
            export PATH="$HOME/depot_tools:$PATH"
            WORKDIR="$HOME/afterbird-chromium"
            printf '%s\n' \
              'solutions = [' \
              '  {' \
              '    "name": "src",' \
              '    "url": "https://chromium.googlesource.com/chromium/src.git",' \
              '    "managed": False,' \
              '    "custom_deps": {},' \
              '    "custom_vars": {},' \
              '  },' \
              ']' \
              'target_os = ["android"]' > "$WORKDIR/.gclient"
            cat "$WORKDIR/.gclient"
      - run:
          name: Sync Chromium Android dependencies
          command: |
            set -eux
            export PATH="$HOME/depot_tools:$PATH"
            export DEPOT_TOOLS_UPDATE=0
            cd "$HOME/afterbird-chromium"
            gclient sync -D --no-history --nohooks
      - run:
          name: Measure dependency footprint
          command: |
            set -eux
            WORKDIR="$HOME/afterbird-chromium"
            SRC_DIR="$WORKDIR/src"
            echo "=== AFTER DEPENDENCY SYNC: DISK ==="
            df -hT
            echo "=== AFTER DEPENDENCY SYNC: SOURCE SIZE ==="
            du -sh "$SRC_DIR"
            echo "=== AFTER DEPENDENCY SYNC: WORKSPACE SIZE ==="
            du -sh "$WORKDIR"
            echo "=== AFTER DEPENDENCY SYNC: GIT SIZE ==="
            du -sh "$SRC_DIR/.git"
            echo "=== AFTER DEPENDENCY SYNC: REVISION ==="
            git -C "$SRC_DIR" rev-parse HEAD
            echo "=== AFTER DEPENDENCY SYNC: TAG ==="
            git -C "$SRC_DIR" describe --tags --exact-match
            echo "=== AFTER DEPENDENCY SYNC: DEPOT TOOLS ==="
            du -sh "$HOME/depot_tools"

workflows:
  c2-chromium-dependencies:
    jobs:
      - c2-chromium-dependencies
